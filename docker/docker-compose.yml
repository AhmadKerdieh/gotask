# docker/docker-compose.yml
#
# Phase 3: postgres. Phase 6 adds keycloak.
#
# Run from the repo root with:
#   docker compose -f docker/docker-compose.yml up -d
#
# The application itself still runs as a local `go run` for the course —
# we are containerising dependencies, not the app, until Phase 10.

services:
  postgres:
    # Pin a specific minor version. "postgres:16" would silently move
    # under you on every pull; reproducibility means pinning. 16 ships
    # gen_random_uuid() in core (no pgcrypto extension needed), which the
    # migration relies on.
    image: postgres:16.3
    container_name: gotask-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: gotask
      POSTGRES_PASSWORD: gotask
      POSTGRES_DB: gotask
    ports:
      # host:container. The app connects to localhost:5432 from outside
      # the compose network (it runs as a local process, not a service
      # here).
      - "5432:5432"
    volumes:
      # Named volume so data survives `docker compose down`. Use
      # `docker compose down -v` to wipe it deliberately.
      - gotask_pgdata:/var/lib/postgresql/data
    healthcheck:
      # pg_isready returns success only once Postgres is actually
      # accepting connections — not merely when the container has
      # started. The Makefile migrate targets wait on this so you never
      # race a migration against a not-yet-ready database.
      test: ["CMD-SHELL", "pg_isready -U gotask -d gotask"]
      interval: 3s
      timeout: 3s
      retries: 10

  keycloak:
    # Pinned, same reproducibility reasoning as postgres. Keycloak 24 is
    # the Quarkus-based distribution; `start-dev` runs the dev profile
    # (in-memory H2, HTTP allowed, no clustering) which is correct for
    # local development and explicitly NOT for production.
    image: quay.io/keycloak/keycloak:24.0
    container_name: gotask-keycloak
    restart: unless-stopped
    command:
      - start-dev
      - --import-realm
    environment:
      # Bootstrap admin for the Keycloak admin console (http://localhost:8081
      # → "Administration Console"). This is the KEYCLOAK admin, unrelated
      # to the gotask "demo" user inside the imported realm.
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      # start-dev defaults the HTTP port to 8080; the app already owns
      # 8080 on the host, so map Keycloak to 8081 and tell Keycloak its
      # own port so issuer URLs it mints match what the app expects
      # (http://localhost:8081/realms/gotask).
      KC_HTTP_PORT: 8081
      KC_HOSTNAME_URL: http://localhost:8081
      KC_HOSTNAME_ADMIN_URL: http://localhost:8081
    ports:
      - "8081:8081"
    volumes:
      # --import-realm reads every *.json in /opt/keycloak/data/import on
      # startup. Mounting our committed realm there makes the realm,
      # client, PKCE settings, and demo user reproducible with zero manual
      # clicking — re-importing an already-present realm is a no-op, so
      # restarts are safe.
      - ./realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    healthcheck:
      # The healthcheck speaks HTTP/1.1 and includes a Host header,
      # because Keycloak in start-dev mode constructs its own URLs from
      # the incoming request's authority. A request with no Host (e.g.
      # HTTP/1.0) makes Keycloak's discovery handler throw an NPE rather
      # than return the document, so the healthcheck must look like a
      # real client.
      #
      # printf (not echo -e) so the CR/LF line terminators are interpreted
      # portably across minimal /bin/sh implementations. Connection: close
      # is required: without it the server holds the socket open and the
      # `grep < &3` blocks until the timeout fires every time.
      test:
        - "CMD-SHELL"
        - >-
          exec 3<>/dev/tcp/127.0.0.1/8081
          && printf 'GET /realms/gotask/.well-known/openid-configuration HTTP/1.1\r\nHost: localhost:8081\r\nConnection: close\r\n\r\n' >&3
          && grep -q jwks_uri <&3
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 60s

volumes:
  gotask_pgdata:
